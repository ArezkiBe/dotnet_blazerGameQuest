events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            
            # CSP spécifique pour Blazor WebAssembly
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8180 http://localhost:5000; img-src 'self' data:; font-src 'self';" always;
        }

        # Configuration pour les fichiers .wasm
        location ~* \.wasm$ {
            root /usr/share/nginx/html;
            add_header Content-Type "application/wasm";
        }

        # Configuration pour les fichiers .dll et .pdb
        location ~* \.(dll|pdb)$ {
            root /usr/share/nginx/html;
            add_header Content-Type "application/octet-stream";
        }
    }
}